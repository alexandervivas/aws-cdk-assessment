name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: ./mvnw -B verify
      # cdk synth packages service/target/person-service.jar, which the verify step builds.
      - run: npx cdk synth
      - uses: actions/upload-artifact@v7
        with:
          name: cdk.out
          # The templates are the review artifact. The asset folders only hold the jar again.
          path: |
            cdk.out
            !cdk.out/asset.*
          if-no-files-found: error
          retention-days: 7
